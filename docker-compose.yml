services:
  blog:
    container_name: blog
    build:
      context: .
      dockerfile: Dockerfile
      # Set by scripts/deploy.sh; empty when building by hand, and /infra then
      # shows no commit rather than a wrong one.
      args:
        GIT_SHA: ${GIT_SHA:-}
        GIT_SUBJECT: ${GIT_SUBJECT:-}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-}
    # Nothing else should be able to talk to this port: the admin gate trusts
    # headers that only cloudflared or `tailscale serve` can be relied on to
    # set, so whoever can connect can forge their way into /admin.
    #
    # Public traffic arrives through the cloudflared service below, over the
    # compose network (http://blog:3000). This loopback binding exists only for
    # `tailscale serve` on the host. Never widen it — not here, and not from a
    # docker-compose.override.yml on the server.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - BLOG_DIR_PATH=/app/content/blog
      # Admin gate — see src/lib/admin-gate.ts and src/lib/admin-auth.ts
      - ADMIN_TAILNET_HOST=${ADMIN_TAILNET_HOST:-}
      - ADMIN_TAILSCALE_LOGIN=${ADMIN_TAILSCALE_LOGIN:-}
      - ADMIN_SECRET_SLUG=${ADMIN_SECRET_SLUG:-}
      - ADMIN_ACCESS_KEY=${ADMIN_ACCESS_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SECURITY_PIN=${ADMIN_SECURITY_PIN:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
    volumes:
      - views-data:/app/data
      - content-data:/app/content
    restart: unless-stopped
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      # CPU model for /infra (node_cpu_info).
      - --collector.cpu.info
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    expose:
      - "9100"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # The directory, not the file: git replaces prometheus.yml on pull, and a
      # single-file bind mount would keep showing the old one to the container,
      # so the reload in scripts/deploy.sh would re-read a stale config.
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    networks:
      - monitoring
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # No fallback: a missing password stops compose rather than starting
      # Grafana as admin/admin.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      # A directory, like Prometheus's, so a pulled config change is visible.
      - ./monitoring/promtail:/etc/promtail:ro
      - ./monitoring/geolite2:/data/geolite2:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - docker-socket-proxy
    networks:
      - monitoring
      - docker-api

  # Promtail only needs to list containers to find the blog's log file; it
  # reads the file itself from the read-only mount above. The raw Docker socket
  # would hand it — and anyone who took it over — root on the host, so it goes
  # through this proxy, which answers read-only container and network lookups
  # and refuses everything else.
  #
  # Read-only still includes container inspect, i.e. every container's
  # environment and so every secret in .env. The proxy therefore sits alone on
  # docker-api with Promtail, out of reach of the internet-facing blog and
  # cloudflared on the monitoring network.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    expose:
      - "2375"

  # The public door. It dials out to Cloudflare, so the host needs no open
  # port; tunnel routes (Zero Trust dashboard, tunnel "portfolio") point at
  # http://blog:3000 on this network.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - blog
    networks:
      - monitoring

networks:
  monitoring:
  # Promtail ↔ docker-socket-proxy only; internal, so no route out either.
  docker-api:
    internal: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  views-data:
  content-data:
