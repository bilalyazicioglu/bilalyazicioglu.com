name: Cloudflare static site

on:
  push:
    branches: [cloudflare-workers]
  pull_request:
    branches: [cloudflare-workers]

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
      - run: npm run verify:static
      - run: npm run check:worker
